<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino 3D Escape - Forest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #354a38; /* Forest mist color */
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        /* Cinematic Glassmorphism UI */
        .glass-panel {
            pointer-events: auto;
            background: rgba(10, 20, 15, 0.7);
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            max-width: 90%;
            width: 450px;
        }
        #score-hud {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6);
            color: #aaff00;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            pointer-events: none;
            display: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-cinematic {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            transition: all 0.2s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .btn-cinematic:hover {
            background: linear-gradient(135deg, #388e3c 0%, #2e7d32 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 125, 50, 0.5);
        }
        .btn-cinematic:active {
            transform: translateY(1px) scale(0.98);
        }
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: 0 0 200px rgba(0,0,0,0.8) inset;
            z-index: 5;
        }
        .btn-danger {
            background: linear-gradient(135deg, #d32f2f 0%, #9a0007 100%);
        }
        .btn-danger:hover {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            box-shadow: 0 8px 25px rgba(211, 47, 47, 0.5);
        }
    </style>
</head>
<body>
    <div class="vignette"></div>
    <!-- HUD -->
    <div id="score-hud">SCORE: <span id="score-val">0</span></div>

    <!-- UI Screens -->
    <div class="ui-layer" id="ui-container">
        <!-- Start Screen -->
        <div id="start-screen" class="glass-panel">
            <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600 mb-2 tracking-wider">JUNGLE ESCAPE</h1>
            <p class="text-gray-300 mb-6 text-lg font-light tracking-wide">Survive the primal forest.</p>
            
            <div class="text-sm text-gray-300 mb-8 space-y-3 bg-black bg-opacity-40 p-5 rounded-xl text-left border border-white border-opacity-10">
                <div class="flex items-center"><span class="text-xl mr-3">💻</span> <b>PC:</b>&nbsp; A/D or Arrows to dodge. Space to jump.</div>
                <div class="flex items-center"><span class="text-xl mr-3">📱</span> <b>Mobile:</b>&nbsp; Swipe L/R to dodge. Tap to jump.</div>
            </div>
            
            <button id="start-btn" class="btn-cinematic text-white px-8 py-4 rounded-xl font-bold text-xl shadow-lg w-full pointer-events-auto uppercase tracking-widest">
                Initiate Run
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="glass-panel hidden border-red-900 border">
            <h1 class="text-5xl font-black text-red-600 mb-2 tracking-widest">PREY</h1>
            <p class="text-gray-300 mb-6 text-lg">The apex predator caught you.</p>
            <div class="bg-black bg-opacity-50 rounded-xl p-4 mb-8 border border-red-500 border-opacity-30">
                <p class="text-gray-400 text-sm uppercase tracking-widest mb-1">Final Distance</p>
                <p class="font-black text-5xl text-green-400"><span id="final-score">0</span>m</p>
            </div>
            <button id="restart-btn" class="btn-danger text-white px-8 py-4 rounded-xl font-bold text-xl shadow-lg w-full pointer-events-auto uppercase tracking-widest">
                Try Again
            </button>
        </div>
    </div>

    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <script>
        // --- THREE.JS SETUP (CINEMATIC FOREST) ---
        const scene = new THREE.Scene();
        const fogColor = new THREE.Color(0x354a38); // Deep forest mist
        scene.background = fogColor;
        scene.fog = new THREE.FogExp2(fogColor, 0.035); 

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3.5, 6.5);
        camera.lookAt(0, 1.5, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- LIGHTING ---
        // Canopy light (greenish top, dark soil bottom)
        const hemiLight = new THREE.HemisphereLight(0x88bb88, 0x112211, 0.6);
        scene.add(hemiLight);

        // Sun filtering through trees
        const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        dirLight.position.set(15, 30, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 70;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // --- ENVIRONMENT ---
        // Forest Ground
        const groundGeo = new THREE.PlaneGeometry(120, 400, 10, 10);
        const posAttr = groundGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            if (posAttr.getZ(i) !== 0) { 
                posAttr.setZ(i, (Math.random() - 0.5) * 0.6); // Slightly bumpier ground
            }
        }
        groundGeo.computeVertexNormals();

        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x243b1e, // Dark mossy green
            roughness: 0.95, 
            metalness: 0.02,
            flatShading: true
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Fireflies / Floating Spores Particle System
        const fireflyCount = 1500;
        const fireflyGeo = new THREE.BufferGeometry();
        const fireflyPos = new Float32Array(fireflyCount * 3);
        const fireflyPhase = new Float32Array(fireflyCount); // For individual swaying

        for(let i=0; i < fireflyCount; i++) {
            fireflyPos[i*3] = (Math.random() - 0.5) * 40;     // X
            fireflyPos[i*3+1] = Math.random() * 10;           // Y
            fireflyPos[i*3+2] = (Math.random() - 0.5) * 80;   // Z
            fireflyPhase[i] = Math.random() * Math.PI * 2;
        }
        fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPos, 3));
        fireflyGeo.setAttribute('phase', new THREE.BufferAttribute(fireflyPhase, 1));
        
        const fireflyMat = new THREE.PointsMaterial({
            color: 0xaaff00, // Glowing green/yellow
            size: 0.15,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const fireflySystem = new THREE.Points(fireflyGeo, fireflyMat);
        scene.add(fireflySystem);

        // --- MODELS ---

        // 1. Procedural Caveman (Smooth & Organic)
        const player = new THREE.Group();
        player.position.set(0, 0, 0); 
        
        // Removed flatShading for smooth look
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xe5ac85, roughness: 0.6 });
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x221100, roughness: 0.9 });
        const clothMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 });
        
        // Smooth Head
        const headGeo = new THREE.SphereGeometry(0.25, 32, 32);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.y = 1.3;
        head.castShadow = true;
        player.add(head);
        
        // Smooth Hair
        const hairGeo = new THREE.SphereGeometry(0.27, 32, 32);
        const hair = new THREE.Mesh(hairGeo, hairMat);
        hair.position.y = 1.45;
        hair.scale.set(1.05, 0.8, 1.05);
        hair.castShadow = true;
        player.add(hair);
        
        // Smooth Body (Scaled Sphere to make an oval shape)
        const bodyGeo = new THREE.SphereGeometry(0.28, 32, 32);
        const body = new THREE.Mesh(bodyGeo, skinMat);
        body.scale.set(1, 1.5, 0.8);
        body.position.y = 0.85;
        body.castShadow = true;
        player.add(body);
        
        // Smooth Cloth
        const clothGeo = new THREE.CylinderGeometry(0.32, 0.35, 0.45, 32);
        const cloth = new THREE.Mesh(clothGeo, clothMat);
        cloth.position.y = 0.65;
        cloth.castShadow = true;
        player.add(cloth);
        
        // Smooth Legs
        const legGeo = new THREE.CylinderGeometry(0.08, 0.06, 0.45, 32);
        const leftLeg = new THREE.Mesh(legGeo, skinMat);
        leftLeg.position.set(-0.15, 0.225, 0);
        leftLeg.castShadow = true;
        player.add(leftLeg);
        
        const rightLeg = new THREE.Mesh(legGeo, skinMat);
        rightLeg.position.set(0.15, 0.225, 0);
        rightLeg.castShadow = true;
        player.add(rightLeg);
        
        scene.add(player);

        // 2. Procedural T-Rex (Smooth & Watercolor Style)
        const dino = new THREE.Group();
        dino.position.set(0, 0, 12); 
        
        const trexGreen = new THREE.MeshStandardMaterial({ 
            color: 0x5c7a65, // Watercolor green
            roughness: 0.6
        }); 
        const trexBelly = new THREE.MeshStandardMaterial({ 
            color: 0xdaccb0, // Cream/yellowish underbelly
            roughness: 0.7
        });
        const toothMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        
        // Smooth Body (Scaled Sphere)
        const trexBodyGeo = new THREE.SphereGeometry(1.6, 32, 32);
        const trexBody = new THREE.Mesh(trexBodyGeo, trexGreen);
        trexBody.scale.set(0.9, 1.2, 1.8);
        trexBody.position.y = 3.2;
        trexBody.rotation.x = Math.PI / 12;
        trexBody.castShadow = true;
        
        // Smooth Belly patch (Scaled Sphere slightly protruding)
        const bellyGeo = new THREE.SphereGeometry(1.5, 32, 32);
        const belly = new THREE.Mesh(bellyGeo, trexBelly);
        belly.scale.set(0.85, 1.15, 1.7);
        belly.position.set(0, -0.1, 0.2);
        trexBody.add(belly);
        dino.add(trexBody);
        
        // Head Group
        const trexHeadGroup = new THREE.Group();
        trexHeadGroup.position.set(0, 4.2, -2.5);
        
        // Smooth Upper Jaw/Skull
        const skullGeo = new THREE.SphereGeometry(1.0, 32, 32);
        const trexSkull = new THREE.Mesh(skullGeo, trexGreen);
        trexSkull.scale.set(1.0, 0.8, 1.6);
        trexSkull.castShadow = true;
        trexHeadGroup.add(trexSkull);
        
        // Smooth Lower Jaw
        const jawGeo = new THREE.SphereGeometry(0.9, 32, 32);
        const trexJaw = new THREE.Mesh(jawGeo, trexBelly);
        trexJaw.scale.set(0.9, 0.4, 1.5);
        trexJaw.position.set(0, -0.6, 0.2);
        trexJaw.rotation.x = Math.PI / 6; // Open mouth
        trexJaw.castShadow = true;
        trexHeadGroup.add(trexJaw);

        // Teeth (Smooth Cones)
        const toothGeo = new THREE.ConeGeometry(0.06, 0.3, 16);
        for(let i=0; i<6; i++) {
            let toothL = new THREE.Mesh(toothGeo, toothMat);
            toothL.position.set(-0.7, -0.6, -1.2 + i*0.4);
            toothL.rotation.x = Math.PI; 
            trexSkull.add(toothL);
            let toothR = new THREE.Mesh(toothGeo, toothMat);
            toothR.position.set(0.7, -0.6, -1.2 + i*0.4);
            toothR.rotation.x = Math.PI;
            trexSkull.add(toothR);
        }
        for(let i=0; i<5; i++) {
            let toothL = new THREE.Mesh(toothGeo, toothMat);
            toothL.position.set(-0.6, 0.2, -1.0 + i*0.4);
            trexJaw.add(toothL);
            let toothR = new THREE.Mesh(toothGeo, toothMat);
            toothR.position.set(0.6, 0.2, -1.0 + i*0.4);
            trexJaw.add(toothR);
        }

        // Eyes (Smooth Spheres)
        const eyeGeo = new THREE.SphereGeometry(0.18, 32, 32);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, emissive: 0x554400, roughness: 0.1 });
        const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
        leftEye.position.set(-0.7, 0.4, -0.8);
        trexHeadGroup.add(leftEye);
        const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
        rightEye.position.set(0.7, 0.4, -0.8);
        trexHeadGroup.add(rightEye);
        
        dino.add(trexHeadGroup);
        
        // Smooth Tail (Cone with high segments)
        const tailGeo = new THREE.ConeGeometry(1.2, 5.0, 32);
        const tail = new THREE.Mesh(tailGeo, trexGreen);
        tail.position.set(0, 2.5, 4.0);
        tail.rotation.x = -Math.PI / 2.5;
        tail.castShadow = true;
        
        const tailBellyGeo = new THREE.ConeGeometry(1.1, 4.8, 32);
        const tailBelly = new THREE.Mesh(tailBellyGeo, trexBelly);
        tailBelly.position.set(0, 0, 0.1);
        tail.add(tailBelly);
        dino.add(tail);

        // Back Spikes (Smooth Cones)
        const spikeGeo = new THREE.ConeGeometry(0.15, 0.6, 16);
        for(let i=0; i<5; i++) {
            let spike = new THREE.Mesh(spikeGeo, trexGreen);
            spike.position.set(0, 1.4, -1.5 + i*0.8);
            trexBody.add(spike);
        }
        for(let i=0; i<4; i++) {
            let spike = new THREE.Mesh(spikeGeo, trexGreen);
            spike.position.set(0, 1.2, i*1.0 - 1.0);
            spike.rotation.x = Math.PI / 2;
            tail.add(spike);
        }
        
        // Smooth Legs & Arms
        const dinoLegGeo = new THREE.CylinderGeometry(0.6, 0.3, 2.2, 32);
        const dLeftLeg = new THREE.Mesh(dinoLegGeo, trexGreen);
        dLeftLeg.position.set(-1.2, 1.1, 1.5);
        dLeftLeg.castShadow = true;
        dino.add(dLeftLeg);
        
        const dRightLeg = new THREE.Mesh(dinoLegGeo, trexGreen);
        dRightLeg.position.set(1.2, 1.1, 1.5);
        dRightLeg.castShadow = true;
        dino.add(dRightLeg);

        const armGeo = new THREE.CylinderGeometry(0.12, 0.08, 0.8, 32);
        const leftArm = new THREE.Mesh(armGeo, trexGreen);
        leftArm.position.set(-1.0, 2.5, -1.2);
        leftArm.rotation.x = Math.PI / 3;
        dino.add(leftArm);
        
        const rightArm = new THREE.Mesh(armGeo, trexGreen);
        rightArm.position.set(1.0, 2.5, -1.2);
        rightArm.rotation.x = Math.PI / 3;
        dino.add(rightArm);
        
        scene.add(dino);

        // --- GAME STATE ---
        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 0.4;
        const laneWidth = 3.0;
        let currentLane = 0; 
        
        let yVelocity = 0;
        const gravity = -0.025;
        const jumpStrength = 0.45;
        let isJumping = false;

        let obstacles = [];

        // UI Elements
        const uiContainer = document.getElementById('ui-container');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreHud = document.getElementById('score-hud');
        const scoreVal = document.getElementById('score-val');
        const finalScoreVal = document.getElementById('final-score');

        // --- OBSTACLE SPANWER (FOREST THEME) ---
        // Removed flatShading to ensure rocks and trees are smoothly rendered
        const mossyRockMat = new THREE.MeshStandardMaterial({ color: 0x4a5d23, roughness: 0.9 });
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3424, roughness: 1.0 });
        const pineMat = new THREE.MeshStandardMaterial({ color: 0x1f3d17, roughness: 0.8 });

        function spawnObstacle() {
            if (!isPlaying) return;

            const lane = Math.floor(Math.random() * 3) - 1;
            const xPos = lane * laneWidth;
            const isTree = Math.random() > 0.5;
            
            const obsGroup = new THREE.Group();
            let hitRadius, hitHeight;

            if (isTree) {
                // Smooth Pine Tree (Cylinder Trunk + Cone Leaves)
                const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1.5, 32);
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 0.75;
                trunk.castShadow = true;
                obsGroup.add(trunk);
                
                const leavesBottomGeo = new THREE.ConeGeometry(1.2, 2.0, 32);
                const leavesBottom = new THREE.Mesh(leavesBottomGeo, pineMat);
                leavesBottom.position.y = 1.8;
                leavesBottom.castShadow = true;
                obsGroup.add(leavesBottom);

                const leavesTopGeo = new THREE.ConeGeometry(0.9, 1.8, 32);
                const leavesTop = new THREE.Mesh(leavesTopGeo, pineMat);
                leavesTop.position.y = 2.8;
                leavesTop.castShadow = true;
                obsGroup.add(leavesTop);
                
                hitRadius = 0.6; // Core collision
                hitHeight = 3.5; // Unjumpable
            } else {
                // Smooth Mossy Rock (Sphere shaped like a boulder)
                const rockSize = 0.8 + Math.random() * 0.4;
                const rockGeo = new THREE.SphereGeometry(rockSize, 32, 32);
                const rock = new THREE.Mesh(rockGeo, mossyRockMat);
                
                // Flatten and elongate to look like a natural rock
                rock.scale.set(1.2, 0.7, 1.0);
                rock.position.y = rockSize * 0.5;
                rock.rotation.set(0, Math.random() * Math.PI, 0);
                rock.castShadow = true;
                
                obsGroup.add(rock);
                
                hitRadius = rockSize * 1.0;
                hitHeight = rockSize * 1.2;
            }

            obsGroup.position.set(xPos, 0, -80);
            scene.add(obsGroup);
            
            obstacles.push({
                mesh: obsGroup,
                hitRadius: hitRadius,
                hitHeight: hitHeight,
                type: isTree ? 'tree' : 'rock'
            });

            const baseTime = 1200;
            const speedFactor = (gameSpeed - 0.4) * 2000;
            const nextSpawnTime = Math.max(400, baseTime - speedFactor + (Math.random() * 400)); 
            setTimeout(spawnObstacle, nextSpawnTime);
        }

        // --- GAME LOGIC ---
        function resetGame() {
            score = 0;
            gameSpeed = 0.4;
            currentLane = 0;
            player.position.set(0, 0, 0); 
            player.rotation.set(0,0,0);
            
            dino.position.set(0, 0, 12); 
            dino.rotation.set(0,0,0);
            
            isJumping = false;
            yVelocity = 0;
            
            obstacles.forEach(obs => scene.remove(obs.mesh));
            obstacles = [];
            
            scoreVal.innerText = score;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreHud.style.display = 'block';
            uiContainer.style.pointerEvents = 'none'; 
            
            isPlaying = true;
            isGameOver = false;
            
            spawnObstacle();
        }

        function triggerGameOver() {
            isPlaying = false;
            isGameOver = true;
            
            let shakeTicks = 0;
            let shakeInterval = setInterval(() => {
                camera.position.x = (Math.random() - 0.5) * 1.5;
                camera.position.y = 3.5 + (Math.random() - 0.5) * 1.5;
                shakeTicks++;
                if(shakeTicks > 15) {
                    clearInterval(shakeInterval);
                    camera.position.set(0, 3.5, 6.5);
                    
                    finalScoreVal.innerText = Math.floor(score);
                    gameOverScreen.classList.remove('hidden');
                    scoreHud.style.display = 'none';
                    uiContainer.style.pointerEvents = 'auto'; 
                }
            }, 40);
        }

        // --- CONTROLS ---
        function moveLeft() { if (currentLane > -1) currentLane--; }
        function moveRight() { if (currentLane < 1) currentLane++; }
        function jump() {
            if (!isJumping) {
                isJumping = true;
                yVelocity = jumpStrength;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
            if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') jump();
        });

        let touchStartX = 0, touchStartY = 0, touchTime = 0;
        window.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            touchTime = Date.now();
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            if (!isPlaying) return;
            let dx = e.changedTouches[0].screenX - touchStartX;
            let dy = e.changedTouches[0].screenY - touchStartY;
            let timeDiff = Date.now() - touchTime;

            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
                if (dx > 0) moveRight(); else moveLeft();
            } else if (Math.abs(dx) < 30 && Math.abs(dy) < 30 && timeDiff < 300) {
                jump();
            } else if (dy < -30) {
                jump();
            }
        });

        document.getElementById('start-btn').addEventListener('click', resetGame);
        document.getElementById('restart-btn').addEventListener('click', resetGame);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- MAIN RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now();

            // Animate Fireflies / Spores
            const positions = fireflySystem.geometry.attributes.position.array;
            const phases = fireflySystem.geometry.attributes.phase.array;
            
            for(let i=0; i<fireflyCount; i++) {
                let pIndex = i * 3;
                
                // Slow drift towards camera
                positions[pIndex + 2] += (isPlaying ? gameSpeed * 1.2 : 0.05);
                
                // Gentle floating up and swaying
                positions[pIndex + 1] += Math.sin(time * 0.002 + phases[i]) * 0.01;
                positions[pIndex] += Math.cos(time * 0.001 + phases[i]) * 0.01;
                
                // Reset if behind camera
                if(positions[pIndex + 2] > 15) {
                    positions[pIndex + 2] = -80; 
                    positions[pIndex] = (Math.random() - 0.5) * 40; 
                    positions[pIndex + 1] = Math.random() * 10;
                }
            }
            fireflySystem.geometry.attributes.position.needsUpdate = true;

            if (isPlaying) {
                score += gameSpeed * 0.2;
                scoreVal.innerText = Math.floor(score);
                if (gameSpeed < 1.2) gameSpeed += 0.0001;

                // Player Lerp Movement
                const targetX = currentLane * laneWidth;
                player.position.x += (targetX - player.position.x) * 0.15;

                // Jump Physics
                if (isJumping) {
                    player.position.y += yVelocity;
                    yVelocity += gravity;
                    player.rotation.x -= 0.12; 

                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        isJumping = false;
                        yVelocity = 0;
                        player.rotation.x = 0;
                    }
                }

                // Obstacles Logic
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.mesh.position.z += gameSpeed;

                    let pPos = player.position;
                    let oPos = obs.mesh.position;
                    
                    let distZ = Math.abs(pPos.z - oPos.z);
                    let distX = Math.abs(pPos.x - oPos.x);
                    
                    if (distZ < 1.2 && distX < obs.hitRadius) {
                        if (pPos.y > obs.hitHeight - 0.2) {
                            // Cleared!
                        } else {
                            triggerGameOver();
                        }
                    }

                    if (oPos.z > 15) {
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                    }
                }
                
                // Dynamic Dino Animation
                dino.position.x += (player.position.x - dino.position.x) * 0.05; 
                dino.position.y = Math.sin(time * 0.015) * 0.4; 
                dino.rotation.z = Math.sin(time * 0.01) * 0.05; 
                dino.rotation.x = Math.sin(time * 0.02) * 0.05; 
                
                // Caveman Leg Animation
                const runCycle = Math.sin(time * 0.02);
                if (!isJumping) {
                    player.children[4].position.y = 0.225 + Math.max(0, runCycle * 0.15); 
                    player.children[5].position.y = 0.225 + Math.max(0, -runCycle * 0.15); 
                }
                
            } else if (isGameOver) {
                if (dino.position.z > player.position.z + 1.0) {
                    dino.position.z -= 0.6;
                    dino.position.y -= 0.1;
                    dino.rotation.x -= 0.02; 
                }
            } else {
                camera.position.x = Math.sin(time * 0.0005) * 1.5;
                camera.lookAt(0, 1.5, -10);
            }

            renderer.render(scene, camera);
        }

        window.onload = () => animate();

    </script>
</body>
</html>
