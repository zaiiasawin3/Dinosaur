<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino 3D Cinematic Forest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Map for Modern Three.js & Post-Processing -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #13211a;
            font-family: 'Inter', sans-serif;
            touch-action: none;
            user-select: none;
        }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Glassmorphism UI */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .glass-panel {
            pointer-events: auto;
            background: rgba(15, 25, 20, 0.65);
            padding: 3rem; border-radius: 2rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.05);
            color: #fff; max-width: 90%; width: 480px; text-align: center;
        }
        #score-hud {
            position: absolute; top: 30px; right: 30px;
            background: rgba(15, 25, 20, 0.5); color: #cfff70;
            padding: 15px 25px; border-radius: 16px;
            font-size: 1.8rem; font-weight: 900; letter-spacing: 2px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none;
        }
        .btn-cinematic {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-cinematic:hover {
            background: linear-gradient(135deg, #388e3c 0%, #2e7d32 100%);
            transform: translateY(-3px); box-shadow: 0 15px 35px rgba(46, 125, 50, 0.6);
        }
        .vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; box-shadow: 0 0 250px rgba(0,0,0,0.85) inset; z-index: 5;
        }
        .text-gradient {
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="vignette"></div>
    
    <div id="score-hud">
        <div>SCORE: <span id="score-val">0</span></div>
        <div class="text-sm text-cyan-300 mt-1 drop-shadow-md text-right">GEMS: <span id="gems-val">0</span></div>
    </div>

    <div class="ui-layer" id="ui-container">
        <!-- Start Menu -->
        <div id="start-screen" class="glass-panel">
            <h1 class="text-5xl font-black mb-2 tracking-widest text-gradient bg-gradient-to-r from-green-300 via-emerald-400 to-teal-500">PRIMAL RUN</h1>
            <p class="text-gray-300 mb-8 text-lg font-light tracking-wide">Cinematic Forest Escape</p>
            <div class="text-sm text-gray-300 mb-8 space-y-4 bg-black bg-opacity-40 p-6 rounded-2xl text-left border border-white border-opacity-10">
                <div class="flex items-center"><span class="text-2xl mr-4">⌨️</span> <div><b>PC:</b> A/D to Dodge. Space to Jump.</div></div>
                <div class="flex items-center"><span class="text-2xl mr-4">📱</span> <div><b>Mobile:</b> Swipe L/R. Tap to Jump.</div></div>
            </div>
            <button id="start-btn" class="btn-cinematic text-white px-8 py-4 rounded-xl font-bold text-xl w-full pointer-events-auto uppercase tracking-widest shadow-lg">
                Start Engine
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="glass-panel hidden" style="border-color: rgba(220,38,38,0.3);">
            <h1 class="text-6xl font-black text-red-500 mb-2 tracking-widest" style="text-shadow: 0 0 20px rgba(220,38,38,0.5);">CRASHED!</h1>
            <p class="text-gray-400 mb-8 text-lg">The T-Rex caught up to you.</p>
            <div class="bg-black bg-opacity-50 rounded-2xl p-6 mb-8 border border-red-500 border-opacity-30">
                <p class="text-gray-400 text-sm uppercase tracking-widest mb-2">Distance Survived</p>
                <p class="font-black text-6xl text-gradient bg-gradient-to-br from-green-400 to-green-600"><span id="final-score">0</span>m</p>
                <p class="text-cyan-400 mt-4 text-xl font-bold uppercase tracking-wider">Gems Extracted: <span id="final-gems">0</span></p>
            </div>
            <button id="restart-btn" class="btn-cinematic !from-red-700 !to-red-900 hover:!from-red-600 hover:!to-red-800 text-white px-8 py-4 rounded-xl font-bold text-xl w-full pointer-events-auto uppercase tracking-widest shadow-lg">
                Drive Again
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ==========================================
        // 1. SCENE, CAMERA, RENDERER
        // ==========================================
        const scene = new THREE.Scene();
        const fogColor = new THREE.Color(0x13211a); // Greenish-grey fog for primal forest
        scene.background = fogColor;
        scene.fog = new THREE.FogExp2(fogColor, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);
        camera.position.set(0, 4, 8.5); // Slightly higher for SUV
        camera.lookAt(0, 1.5, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ==========================================
        // 2. POST-PROCESSING (BLOOM)
        // ==========================================
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.1);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.0; 
        bloomPass.radius = 0.5;
        
        const outputPass = new OutputPass();
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);
        composer.addPass(outputPass);

        // ==========================================
        // 3. LIGHTING (CINEMATIC)
        // ==========================================
        const hemiLight = new THREE.HemisphereLight(0x739c7e, 0x0a120e, 0.9);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfff0dd, 2.2); 
        dirLight.position.set(20, 40, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        const d = 30;
        dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        // ==========================================
        // 4. ENVIRONMENT
        // ==========================================
        // Mossy Ground
        const groundMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x18261c, roughness: 0.9, metalness: 0.0,
            bumpScale: 0.05
        });
        const groundGeo = new THREE.PlaneGeometry(150, 400, 30, 30);
        const posAttr = groundGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            if (posAttr.getZ(i) !== 0) posAttr.setZ(i, (Math.random() - 0.5) * 1.5);
        }
        groundGeo.computeVertexNormals();
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==========================================
        // 5. PROCEDURAL MODELS
        // ==========================================
        
        // --- Player (SUV + Caveman) ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        const suvBodyGroup = new THREE.Group();
        const suvWheels = []; // Store wheels for animation

        // SUV Materials
        const carPaintMat = new THREE.MeshPhysicalMaterial({ color: 0x334455, metalness: 0.6, roughness: 0.3, clearcoat: 0.8 }); // Rugged Grey/Blue
        const carGlassMat = new THREE.MeshPhysicalMaterial({ color: 0x050505, metalness: 0.9, roughness: 0.1 });
        const tireMat = new THREE.MeshPhysicalMaterial({ color: 0x111111, roughness: 0.9, metalness: 0.1 });
        const rimMat = new THREE.MeshPhysicalMaterial({ color: 0xaaaaaa, roughness: 0.4, metalness: 0.8 });

        // SUV Lower Body
        const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.8, 4.0), carPaintMat);
        lowerBody.position.y = 0.8;
        lowerBody.castShadow = true;
        suvBodyGroup.add(lowerBody);

        // SUV Cabin (Top part)
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 2.2), carGlassMat);
        cabin.position.set(0, 1.55, -0.3);
        cabin.castShadow = true;
        suvBodyGroup.add(cabin);

        // Wheels setup
        const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 32); 
        wheelGeo.rotateZ(Math.PI / 2);
        const rimGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.42, 16); 
        rimGeo.rotateZ(Math.PI / 2);

        const wheelPositions = [ [-1.0, 0.45, 1.2], [1.0, 0.45, 1.2], [-1.0, 0.45, -1.2], [1.0, 0.45, -1.2] ];
        wheelPositions.forEach(pos => {
            const wGroup = new THREE.Group();
            const tire = new THREE.Mesh(wheelGeo, tireMat); 
            const rim = new THREE.Mesh(rimGeo, rimMat);
            tire.castShadow = true; 
            wGroup.add(tire, rim); 
            wGroup.position.set(...pos);
            suvBodyGroup.add(wGroup); 
            suvWheels.push(wGroup);
        });
        playerGroup.add(suvBodyGroup);

        // Caveman sitting on the sunroof
        const caveman = new THREE.Group();
        caveman.position.set(0, 1.9, -0.3);
        
        const skinMat = new THREE.MeshPhysicalMaterial({ color: 0xde9b71, roughness: 0.5 });
        const clothMat = new THREE.MeshPhysicalMaterial({ color: 0x4a2e1b, roughness: 0.9 });
        
        const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), skinMat); pHead.position.y = 0.9; pHead.castShadow = true;
        const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.6, 16), clothMat); pBody.position.y = 0.4; pBody.castShadow = true;
        const pArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.4, 16), skinMat); pArmL.position.set(-0.3, 0.5, 0.2); pArmL.rotation.x = -Math.PI / 4; pArmL.castShadow = true;
        const pArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.4, 16), skinMat); pArmR.position.set(0.3, 0.5, 0.2); pArmR.rotation.x = -Math.PI / 4; pArmR.castShadow = true;
        
        caveman.add(pHead, pBody, pArmL, pArmR);
        playerGroup.add(caveman);

        // --- Enemy (T-Rex) ---
        const tRexGroup = new THREE.Group();
        tRexGroup.position.set(0, 0, 18); // Chasing from behind
        scene.add(tRexGroup);

        const tGreenMat = new THREE.MeshPhysicalMaterial({ color: 0x476b53, roughness: 0.8, metalness: 0.1 });
        const tBellyMat = new THREE.MeshPhysicalMaterial({ color: 0xc4b79b, roughness: 0.9 });
        const tToothMat = new THREE.MeshStandardMaterial({ color: 0xffffee, roughness: 0.3 });
        const tEyeMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff4400, emissiveIntensity: 2.5 }); // Glowing eyes

        // Main Body
        const tBody = new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 32), tGreenMat); 
        tBody.scale.set(0.9, 1.2, 1.8); tBody.position.y = 3.2; tBody.rotation.x = 0.2; tBody.castShadow = true;
        
        const tBelly = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), tBellyMat); 
        tBelly.scale.set(0.85, 1.15, 1.7); tBelly.position.set(0, -0.1, 0.2); 
        tBody.add(tBelly);
        tRexGroup.add(tBody);

        // Head Group (for animation)
        const tHeadGroup = new THREE.Group(); 
        tHeadGroup.position.set(0, 4.2, -2.5); 
        tRexGroup.add(tHeadGroup);
        
        const tSkull = new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 32), tGreenMat); 
        tSkull.scale.set(1, 0.8, 1.6); tSkull.castShadow = true; 
        tHeadGroup.add(tSkull);
        
        const tJaw = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), tBellyMat); 
        tJaw.scale.set(0.9, 0.4, 1.5); tJaw.position.set(0, -0.7, 0.2); tJaw.rotation.x = 0.4; tJaw.castShadow = true; 
        tHeadGroup.add(tJaw);

        // Teeth & Eyes
        const toothGeo = new THREE.ConeGeometry(0.08, 0.35, 8);
        for(let i=0; i<6; i++) {
            let tl = new THREE.Mesh(toothGeo, tToothMat); tl.position.set(-0.7, -0.6, -1.2 + i*0.4); tl.rotation.x = Math.PI; tSkull.add(tl);
            let tr = new THREE.Mesh(toothGeo, tToothMat); tr.position.set(0.7, -0.6, -1.2 + i*0.4); tr.rotation.x = Math.PI; tSkull.add(tr);
            let jl = new THREE.Mesh(toothGeo, tToothMat); jl.position.set(-0.6, 0.3, -1.0 + i*0.4); tJaw.add(jl);
            let jr = new THREE.Mesh(toothGeo, tToothMat); jr.position.set(0.6, 0.3, -1.0 + i*0.4); tJaw.add(jr);
        }
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), tEyeMat); eyeL.position.set(-0.75, 0.3, -0.8); tHeadGroup.add(eyeL);
        const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), tEyeMat); eyeR.position.set(0.75, 0.3, -0.8); tHeadGroup.add(eyeR);

        // Tail & Spikes
        const tTail = new THREE.Mesh(new THREE.ConeGeometry(1.0, 5.5, 32), tGreenMat); 
        tTail.position.set(0, 2.5, 4.2); tTail.rotation.x = -1.2; tTail.castShadow = true; 
        tRexGroup.add(tTail);
        
        const spikeGeo = new THREE.ConeGeometry(0.2, 0.7, 8);
        for(let i=0; i<5; i++) { let s = new THREE.Mesh(spikeGeo, tGreenMat); s.position.set(0, 1.4, -1.2 + i*0.8); tBody.add(s); }
        for(let i=0; i<4; i++) { let s = new THREE.Mesh(spikeGeo, tGreenMat); s.position.set(0, 1.2, i*1.2 - 1.0); s.rotation.x = 1.5; tTail.add(s); }

        // Legs (Store for animation)
        const dLegGeo = new THREE.CylinderGeometry(0.5, 0.3, 2.5, 16);
        const tLegL = new THREE.Mesh(dLegGeo, tGreenMat); tLegL.position.set(-1.2, 1.25, 1.5); tLegL.castShadow = true; tRexGroup.add(tLegL);
        const tLegR = new THREE.Mesh(dLegGeo, tGreenMat); tLegR.position.set(1.2, 1.25, 1.5); tLegR.castShadow = true; tRexGroup.add(tLegR);

        // ==========================================
        // 6. GAME STATE & OBSTACLES
        // ==========================================
        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let gems = 0;
        let gameSpeed = 0.5;
        const laneWidth = 3.5;
        let currentLane = 0; // -1, 0, 1
        
        let yVelocity = 0;
        const gravity = -0.025;
        const jumpStrength = 0.55;
        let isJumping = false;
        let obstacles = [];
        let collectibles = [];

        // Materials for environment objects
        const rockMat = new THREE.MeshPhysicalMaterial({ color: 0x3d4737, roughness: 1.0, bumpScale: 0.1 }); // Mossy rock
        const barkMat = new THREE.MeshPhysicalMaterial({ color: 0x2e1c12, roughness: 1.0 });
        const leafMat = new THREE.MeshPhysicalMaterial({ color: 0x142b17, roughness: 0.9 });
        const gemMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 2.0, roughness: 0.1, metalness: 0.8 });
        const gemGeo = new THREE.OctahedronGeometry(0.35, 0);

        function spawnObstacle() {
            if (!isPlaying) return;
            const lane = Math.floor(Math.random() * 3) - 1;
            const xPos = lane * laneWidth;
            const isTree = Math.random() > 0.5;
            const obsGroup = new THREE.Group();
            let hitRadius, hitHeight;

            if (isTree) {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 2, 8), barkMat);
                trunk.position.y = 1; trunk.castShadow = true; obsGroup.add(trunk);
                
                const l1 = new THREE.Mesh(new THREE.ConeGeometry(1.6, 3.0, 16), leafMat); l1.position.y = 2.0; l1.castShadow = true; obsGroup.add(l1);
                const l2 = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.5, 16), leafMat); l2.position.y = 3.5; l2.castShadow = true; obsGroup.add(l2);
                
                hitRadius = 0.8; hitHeight = 4.0; 
            } else {
                const size = 1.0 + Math.random() * 0.6;
                const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 1), rockMat);
                rock.scale.set(1.4, 0.7, 1.2); rock.position.y = size * 0.6; 
                rock.rotation.set(Math.random(), Math.random(), 0); rock.castShadow = true;
                obsGroup.add(rock);
                hitRadius = size * 1.2; hitHeight = size * 1.3;
            }

            obsGroup.position.set(xPos, 0, -100);
            scene.add(obsGroup);
            obstacles.push({ mesh: obsGroup, hitRadius, hitHeight });

            const nextSpawnTime = Math.max(300, 1000 - (gameSpeed * 1000) + (Math.random() * 500)); 
            setTimeout(spawnObstacle, nextSpawnTime);
        }

        function spawnItem() {
            if (!isPlaying) return;
            const lane = Math.floor(Math.random() * 3) - 1;
            const xPos = lane * laneWidth;
            
            const gem = new THREE.Mesh(gemGeo, gemMat);
            gem.position.set(xPos, 1.2, -100);
            gem.castShadow = true;
            
            scene.add(gem);
            collectibles.push(gem);
            
            const nextItemTime = Math.max(600, 1800 - (gameSpeed * 1000) + (Math.random() * 1000));
            setTimeout(spawnItem, nextItemTime);
        }

        // ==========================================
        // 7. LOGIC & CONTROLS
        // ==========================================
        const uiContainer = document.getElementById('ui-container');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreHud = document.getElementById('score-hud');
        const scoreVal = document.getElementById('score-val');
        const gemsVal = document.getElementById('gems-val');

        function resetGame() {
            score = 0; gems = 0; gameSpeed = 0.5; currentLane = 0;
            playerGroup.position.set(0, 0, 0); playerGroup.rotation.set(0,0,0);
            tRexGroup.position.set(0, 0, 18); tRexGroup.rotation.set(0,0,0);
            tJaw.rotation.x = 0.4;
            isJumping = false; yVelocity = 0;
            
            obstacles.forEach(obs => scene.remove(obs.mesh)); obstacles = [];
            collectibles.forEach(gem => scene.remove(gem)); collectibles = [];
            
            scoreVal.innerText = score; gemsVal.innerText = gems;
            startScreen.classList.add('hidden'); gameOverScreen.classList.add('hidden');
            scoreHud.style.display = 'block'; uiContainer.style.pointerEvents = 'none'; 
            
            isPlaying = true; isGameOver = false;
            camera.position.set(0, 4, 8.5);
            spawnObstacle(); setTimeout(spawnItem, 1000);
        }

        function triggerGameOver() {
            isPlaying = false; isGameOver = true;
            let shakeTicks = 0;
            // Cinematic Camera Shake
            let shakeInterval = setInterval(() => {
                camera.position.x = (Math.random() - 0.5) * 1.5;
                camera.position.y = 4 + (Math.random() - 0.5) * 1.5;
                shakeTicks++;
                if(shakeTicks > 20) {
                    clearInterval(shakeInterval);
                    camera.position.set(0, 4, 8.5);
                    document.getElementById('final-score').innerText = Math.floor(score);
                    document.getElementById('final-gems').innerText = gems;
                    gameOverScreen.classList.remove('hidden');
                    scoreHud.style.display = 'none'; uiContainer.style.pointerEvents = 'auto'; 
                }
            }, 30);
        }

        function move(dir) {
            if(!isPlaying) return;
            currentLane += dir;
            if(currentLane < -1) currentLane = -1;
            if(currentLane > 1) currentLane = 1;
        }
        function jump() {
            if(!isPlaying || isJumping) return;
            isJumping = true; yVelocity = jumpStrength;
        }

        // Keyboard Setup
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(-1);
            if (e.code === 'ArrowRight' || e.code === 'KeyD') move(1);
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
        });

        // Touch Setup (Mobile)
        let tX = 0, tY = 0;
        window.addEventListener('touchstart', (e) => { 
            tX = e.touches[0].screenX; tY = e.touches[0].screenY; 
        }, {passive: false});
        window.addEventListener('touchend', (e) => {
            let dx = e.changedTouches[0].screenX - tX;
            let dy = e.changedTouches[0].screenY - tY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
                move(dx > 0 ? 1 : -1); // Swipe Horizontal
            } else if (dy < -30 || (Math.abs(dx) < 10 && Math.abs(dy) < 10)) {
                jump(); // Swipe Up or Tap
            }
        });

        document.getElementById('start-btn').addEventListener('click', resetGame);
        document.getElementById('restart-btn').addEventListener('click', resetGame);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 8. ANIMATION LOOP (FIXED)
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now();

            if (isPlaying) {
                // Game Progress
                score += gameSpeed * 0.2;
                scoreVal.innerText = Math.floor(score);
                if (gameSpeed < 1.2) gameSpeed += 0.0001; // Gradually increase speed

                // Player Movement (Lerp X for smooth lane switch)
                playerGroup.position.x += (currentLane * laneWidth - playerGroup.position.x) * 0.15;

                // Jump Physics
                if (isJumping) {
                    playerGroup.position.y += yVelocity; 
                    yVelocity += gravity;
                    suvBodyGroup.rotation.x = -0.15; // Tilt up when jumping
                    
                    if (playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0; 
                        isJumping = false; 
                        yVelocity = 0; 
                        suvBodyGroup.rotation.x = 0;
                    }
                }

                // SUV Animations (Wheels and Bobbing)
                if (!isJumping) {
                    const wheelRot = gameSpeed * 1.2;
                    suvWheels.forEach(w => w.rotation.x -= wheelRot); // Rotate all 4 wheels
                    suvBodyGroup.position.y = Math.sin(time * 0.03) * 0.05; // Suspension bobbing
                    caveman.position.y = 1.9 + Math.sin(time * 0.03 + 1) * 0.03; // Caveman bobbing
                }

                // T-Rex Animation (Running Behind)
                dinoFollowLogic(time);

                // Move and Check Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.mesh.position.z += gameSpeed;
                    
                    let dz = Math.abs(playerGroup.position.z - obs.mesh.position.z);
                    let dx = Math.abs(playerGroup.position.x - obs.mesh.position.x);
                    
                    // SUV Collision Hitbox check
                    if (dz < 2.5 && dx < obs.hitRadius + 0.8) {
                        if (playerGroup.position.y < obs.hitHeight - 0.2) {
                            triggerGameOver();
                        }
                    }
                    // Remove if passed
                    if (obs.mesh.position.z > 15) { 
                        scene.remove(obs.mesh); 
                        obstacles.splice(i, 1); 
                    }
                }

                // Move and Check Collectibles
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    let gem = collectibles[i];
                    gem.position.z += gameSpeed;
                    
                    // Gem Idle Animation
                    gem.rotation.y += 0.05;
                    gem.rotation.x += 0.02;
                    gem.position.y = 1.2 + Math.sin(time * 0.005 + i) * 0.2;
                    
                    let dz = Math.abs(playerGroup.position.z - gem.position.z);
                    let dx = Math.abs(playerGroup.position.x - gem.position.x);
                    let dy = Math.abs((playerGroup.position.y + 1.0) - gem.position.y);
                    
                    if (dz < 1.5 && dx < 1.5 && dy < 2.0) {
                        scene.remove(gem);
                        collectibles.splice(i, 1);
                        score += 50; 
                        gems++;
                        gemsVal.innerText = gems;
                    } else if (gem.position.z > 15) {
                        scene.remove(gem);
                        collectibles.splice(i, 1);
                    }
                }

            } else if (isGameOver) {
                // T-Rex Attack Animation
                if (tRexGroup.position.z > playerGroup.position.z + 2.0) {
                    tRexGroup.position.z -= 0.6; // Lunge forward
                    tRexGroup.position.y -= 0.05;
                    tRexGroup.rotation.x -= 0.01;
                    tJaw.rotation.x = 1.2; // Open mouth wide
                }
            } else {
                // Idle Camera Pan (Main Menu)
                camera.position.x = Math.sin(time * 0.0003) * 2;
                camera.lookAt(0, 1.5, -10);
                dinoFollowLogic(time); // Keep T-Rex idling in background
            }

            // Render Frame via Post-Processing
            composer.render();
        }

        // Helper function for T-Rex animation
        function dinoFollowLogic(time) {
            // T-Rex aligns with player x-position slowly
            tRexGroup.position.x += (playerGroup.position.x - tRexGroup.position.x) * 0.04;
            
            // Body bounce
            const runCycle = Math.sin(time * 0.015);
            tRexGroup.position.y = runCycle * 0.4;
            tRexGroup.rotation.z = Math.sin(time * 0.01) * 0.03;
            
            // Leg animations (opposite oscillation)
            tLegL.position.y = 1.25 + Math.max(0, runCycle * 0.5);
            tLegR.position.y = 1.25 + Math.max(0, -runCycle * 0.5);
            
            // Head look around slightly
            tHeadGroup.rotation.y = Math.sin(time * 0.005) * 0.2;
        }

        // Start loop
        window.onload = () => animate();

    </script>
</body>
