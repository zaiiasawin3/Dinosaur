<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino 3D - Bright Daytime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Fallback */
            font-family: 'Inter', sans-serif;
            touch-action: none;
            user-select: none;
        }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .glass-panel {
            pointer-events: auto;
            background: rgba(10, 20, 30, 0.75);
            padding: 3rem; border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff; max-width: 90%; width: 480px; text-align: center;
        }
        #score-hud {
            position: absolute; top: 30px; right: 30px;
            background: rgba(0, 0, 0, 0.6); color: #fff;
            padding: 12px 24px; border-radius: 12px;
            font-size: 1.8rem; font-weight: 900; letter-spacing: 1px;
            backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); display: none;
            text-shadow: 1px 1px 2px #000;
        }
        #score-hud span#score-val { color: #4ade80; }
        .btn-cinematic {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transition: all 0.2s ease-out;
            border: 1px solid rgba(255,255,255,0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn-cinematic:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transform: translateY(-2px); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5);
        }
        .text-gradient {
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="score-hud">
        <div class="flex justify-between items-center gap-6">
            <span>SCORE</span> <span id="score-val">0</span>
        </div>
        <div class="text-sm text-cyan-400 mt-1 flex justify-between items-center gap-6">
            <span>GEMS</span> <span id="gems-val" class="font-bold">0</span>
        </div>
    </div>

    <div class="ui-layer" id="ui-container">
        <!-- Start Menu -->
        <div id="start-screen" class="glass-panel">
            <h1 class="text-5xl font-black mb-2 tracking-wider text-gradient bg-gradient-to-r from-blue-400 to-emerald-400">DINO ESCAPE</h1>
            <p class="text-gray-300 mb-8 text-lg font-medium">Bright Daytime Run</p>
            <div class="text-sm text-gray-200 mb-8 space-y-4 bg-black bg-opacity-50 p-6 rounded-xl text-left border border-white border-opacity-10">
                <div class="flex items-center"><span class="text-2xl mr-4">⌨️</span> <div><b>PC:</b> A/D or Arrows to Steer.<br>Space to Jump.</div></div>
                <div class="flex items-center"><span class="text-2xl mr-4">📱</span> <div><b>Mobile:</b> Swipe Left/Right.<br>Tap to Jump.</div></div>
            </div>
            <button id="start-btn" class="btn-cinematic text-white px-8 py-4 rounded-xl font-black text-xl w-full pointer-events-auto uppercase tracking-widest shadow-lg">
                Start Game
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="glass-panel hidden" style="border-color: rgba(239,68,68,0.5);">
            <h1 class="text-6xl font-black text-red-500 mb-2 tracking-widest drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">BUSTED!</h1>
            <p class="text-gray-300 mb-8 text-lg font-medium">The T-Rex got you.</p>
            <div class="bg-black bg-opacity-60 rounded-xl p-6 mb-8 border border-red-500 border-opacity-40">
                <p class="text-gray-400 text-sm uppercase tracking-widest mb-1 font-bold">Total Score</p>
                <p class="font-black text-6xl text-gradient bg-gradient-to-br from-green-400 to-emerald-600 drop-shadow-md" id="final-score">0</p>
                <p class="text-cyan-400 mt-4 text-xl font-bold uppercase tracking-wider flex justify-between px-4">
                    <span>Gems:</span> <span id="final-gems">0</span>
                </p>
            </div>
            <button id="restart-btn" class="btn-cinematic !from-red-600 !to-red-800 hover:!from-red-500 hover:!to-red-700 text-white px-8 py-4 rounded-xl font-black text-xl w-full pointer-events-auto uppercase tracking-widest shadow-lg">
                Try Again
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ==========================================
        // 1. SCENE & CAMERA
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // VERY BRIGHT SKY BLUE
        scene.fog = new THREE.Fog(0x87CEEB, 40, 150); // Linear fog for clear visibility

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 4.5, 10);
        camera.lookAt(0, 1.5, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        // Keeping tone mapping simple and bright
        renderer.toneMapping = THREE.LinearToneMapping;
        renderer.toneMappingExposure = 1.0; 
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        // Slight bloom for gems
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.4, 0.85));

        // ==========================================
        // 2. LIGHTING (SUPER BRIGHT)
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3cb371, 1.0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        const d = 40;
        dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // ==========================================
        // 3. ENVIRONMENT
        // ==========================================
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3cb371, roughness: 1.0 }); // Green Grass
        const groundGeo = new THREE.PlaneGeometry(150, 400, 10, 10);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==========================================
        // 4. MODELS
        // ==========================================
        // PLAYER: Blue SUV
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const suvBodyGroup = new THREE.Group();
        const suvWheels = [];
        const suvMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, metalness: 0.2, roughness: 0.6 });
        
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.0, 4.0), suvMat);
        carBody.position.y = 1.0; carBody.castShadow = true;
        suvBodyGroup.add(carBody);
        
        const carTop = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.8, 2.0), new THREE.MeshStandardMaterial({color: 0x222222}));
        carTop.position.set(0, 1.9, -0.2); carTop.castShadow = true;
        suvBodyGroup.add(carTop);

        const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16); wheelGeo.rotateZ(Math.PI/2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const wPos = [[-1.2, 0.5, 1.2], [1.2, 0.5, 1.2], [-1.2, 0.5, -1.2], [1.2, 0.5, -1.2]];
        
        wPos.forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.position.set(...pos); w.castShadow = true;
            suvBodyGroup.add(w);
            suvWheels.push(w);
        });
        playerGroup.add(suvBodyGroup);

        // T-REX
        const tRexGroup = new THREE.Group();
        tRexGroup.position.set(0, 0, 18);
        scene.add(tRexGroup);

        const tMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 }); // Green
        const tBellyMat = new THREE.MeshStandardMaterial({ color: 0xfffdd0 }); // Cream

        const tBody = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 3), tMat);
        tBody.position.y = 3.5; tBody.castShadow = true; tRexGroup.add(tBody);
        
        const tBelly = new THREE.Mesh(new THREE.BoxGeometry(1.9, 2.4, 2.9), tBellyMat);
        tBelly.position.set(0, -0.05, 0.1); tBody.add(tBelly);

        const tHead = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 2.0), tMat);
        tHead.position.set(0, 4.8, -2.0); tHead.castShadow = true; tRexGroup.add(tHead);
        
        const tJaw = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.8), tBellyMat);
        tJaw.position.set(0, 3.8, -2.0); tJaw.rotation.x = 0.4; tJaw.castShadow = true; tRexGroup.add(tJaw);

        const tLegL = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 0.8), tMat); tLegL.position.set(-1.2, 1.25, 0); tRexGroup.add(tLegL);
        const tLegR = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 0.8), tMat); tLegR.position.set(1.2, 1.25, 0); tRexGroup.add(tLegR);

        // ==========================================
        // 5. GAME LOGIC
        // ==========================================
        let isPlaying = false, isGameOver = false;
        let score = 0, gems = 0, gameSpeed = 0.5;
        let currentLane = 0; const laneWidth = 3.5;
        let yVel = 0, isJumping = false;
        const jumpForce = 0.7, gravity = -0.04;
        let obstacles = [], collectibles = [];

        function spawnObstacle() {
            if (!isPlaying) return;
            const lane = Math.floor(Math.random() * 3) - 1;
            const isTree = Math.random() > 0.5;
            const obs = new THREE.Group();
            
            if(isTree) {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2), new THREE.MeshStandardMaterial({color: 0x5c4033}));
                trunk.position.y = 1; obs.add(trunk);
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3), new THREE.MeshStandardMaterial({color: 0x006400}));
                leaves.position.y = 3; obs.add(leaves);
                obs.userData = { hitR: 1.0, hitH: 4.0 };
            } else {
                const rock = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 1.5), new THREE.MeshStandardMaterial({color: 0x808080}));
                rock.position.y = 0.75; obs.add(rock);
                obs.userData = { hitR: 1.2, hitH: 1.5 };
            }
            
            obs.position.set(lane * laneWidth, 0, -120);
            scene.add(obs); obstacles.push(obs);
            setTimeout(spawnObstacle, Math.max(400, 1000 - gameSpeed*500));
        }

        function spawnGem() {
            if(!isPlaying) return;
            const gem = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.5), 
                new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x00aaff})
            );
            gem.position.set((Math.floor(Math.random()*3)-1)*laneWidth, 1.5, -120);
            scene.add(gem); collectibles.push(gem);
            setTimeout(spawnGem, 800 + Math.random()*1000);
        }

        function resetGame() {
            score = 0; gems = 0; gameSpeed = 0.6; currentLane = 0;
            playerGroup.position.set(0,0,0); tRexGroup.position.set(0,0,18);
            isJumping = false; yVel = 0;
            
            obstacles.forEach(o => scene.remove(o)); obstacles = [];
            collectibles.forEach(c => scene.remove(c)); collectibles = [];
            
            document.getElementById('score-val').innerText = '0';
            document.getElementById('gems-val').innerText = '0';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('score-hud').style.display = 'block';
            
            isPlaying = true; isGameOver = false;
            camera.position.set(0, 4.5, 10);
            spawnObstacle(); setTimeout(spawnGem, 1000);
        }

        function die() {
            isPlaying = false; isGameOver = true;
            document.getElementById('final-score').innerText = Math.floor(score);
            document.getElementById('final-gems').innerText = gems;
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('score-hud').style.display = 'none';
        }

        window.addEventListener('keydown', e => {
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') if(currentLane > -1) currentLane--;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') if(currentLane < 1) currentLane++;
            if(e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') if(!isJumping) { isJumping = true; yVel = jumpForce; }
        });

        document.getElementById('start-btn').onclick = resetGame;
        document.getElementById('restart-btn').onclick = resetGame;

        function animate() {
            requestAnimationFrame(animate);
            const t = Date.now();

            if(isPlaying) {
                score += gameSpeed * 0.2;
                document.getElementById('score-val').innerText = Math.floor(score);
                if(gameSpeed < 1.8) gameSpeed += 0.0002;

                playerGroup.position.x += (currentLane * laneWidth - playerGroup.position.x) * 0.2;

                if(isJumping) {
                    playerGroup.position.y += yVel;
                    yVel += gravity;
                    if(playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0; isJumping = false; yVel = 0;
                    }
                } else {
                    suvWheels.forEach(w => w.rotation.x -= gameSpeed * 1.5);
                    suvBodyGroup.position.y = Math.sin(t*0.05)*0.05;
                }

                tRexGroup.position.x += (playerGroup.position.x - tRexGroup.position.x) * 0.05;
                tLegL.rotation.x = Math.sin(t*0.02) * 0.5;
                tLegR.rotation.x = Math.sin(t*0.02 + Math.PI) * 0.5;

                for(let i=obstacles.length-1; i>=0; i--) {
                    let o = obstacles[i]; o.position.z += gameSpeed;
                    if(Math.abs(playerGroup.position.z - o.position.z) < 2.0 && 
                       Math.abs(playerGroup.position.x - o.position.x) < o.userData.hitR &&
                       playerGroup.position.y < o.userData.hitH) {
                        die();
                    }
                    if(o.position.z > 20) { scene.remove(o); obstacles.splice(i,1); }
                }

                for(let i=collectibles.length-1; i>=0; i--) {
                    let c = collectibles[i]; c.position.z += gameSpeed;
                    c.rotation.y += 0.05; c.rotation.x += 0.05;
                    if(Math.abs(playerGroup.position.z - c.position.z) < 2 && 
                       Math.abs(playerGroup.position.x - c.position.x) < 1.5 &&
                       Math.abs(playerGroup.position.y + 1.0 - c.position.y) < 2) {
                        scene.remove(c); collectibles.splice(i,1);
                        score += 50; gems++; document.getElementById('gems-val').innerText = gems;
                    } else if(c.position.z > 20) { scene.remove(c); collectibles.splice(i,1); }
                }
            } else if (isGameOver) {
                if(tRexGroup.position.z > playerGroup.position.z + 2) {
                    tRexGroup.position.z -= 0.5;
                }
            }
            composer.render();
        }
        animate();
    </script>
</body>
</html>
