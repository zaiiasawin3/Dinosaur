<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino 3D Pro - Escape</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .glass-panel {
            pointer-events: auto; background: rgba(15, 23, 42, 0.85);
            padding: 2.5rem; border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; max-width: 90%; width: 450px; text-align: center;
        }
        #score-hud {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.7); color: #fff;
            padding: 12px 20px; border-radius: 12px; font-size: 1.2rem; font-weight: 800;
            backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); display: none; text-shadow: 1px 1px 2px #000;
        }
        #score-hud span.val { color: #4ade80; margin-left: 10px; font-size: 1.5rem;}
        #score-hud span.gem { color: #22d3ee; margin-left: 10px; font-size: 1.5rem;}
        #score-hud .hi-score { font-size: 0.9rem; color: #fbbf24; text-align: right; margin-top: 5px; font-weight: 600;}
        
        .btn-cinematic {
            background: linear-gradient(to right, #3b82f6, #2563eb); transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.2); text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .btn-cinematic:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(37,99,235,0.6); }
        .text-gradient { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="score-hud">
        <div class="flex justify-between items-center"><span>SCORE</span> <span id="score-val" class="val">0</span></div>
        <div class="flex justify-between items-center mt-1"><span>GEMS</span> <span id="gems-val" class="gem">0</span></div>
        <div class="hi-score">HI-SCORE: <span id="hud-hi-score">0</span></div>
    </div>

    <div class="ui-layer" id="ui-container">
        <!-- Start Screen -->
        <div id="start-screen" class="glass-panel">
            <h1 class="text-5xl font-black mb-1 tracking-wider text-gradient bg-gradient-to-r from-cyan-400 to-blue-500">DINO PRO</h1>
            <p class="text-gray-300 mb-6 text-sm font-medium tracking-widest uppercase">Primal Escape</p>
            <div class="bg-slate-900 rounded-xl p-4 mb-6 border border-slate-700 text-left text-sm text-gray-300 space-y-3 shadow-inner">
                <div class="flex items-center gap-3"><span>💻</span> <span><b>PC:</b> A/D or Arrows to Steer. Space to Jump.</span></div>
                <div class="flex items-center gap-3"><span>📱</span> <span><b>Mobile:</b> Swipe Left/Right. Tap to Jump.</span></div>
                <div class="flex items-center gap-3"><span>🔊</span> <span><b>Audio:</b> Procedural Sound & FX Enabled</span></div>
            </div>
            <p class="text-yellow-400 font-bold mb-4 text-sm">BEST SCORE: <span id="menu-hi-score">0</span></p>
            <button id="start-btn" class="btn-cinematic text-white px-8 py-4 rounded-xl font-black text-xl w-full pointer-events-auto uppercase tracking-widest shadow-lg">
                PLAY NOW
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="glass-panel hidden" style="border-color: rgba(239,68,68,0.4);">
            <h1 class="text-5xl font-black text-red-500 mb-2 tracking-widest drop-shadow-[0_0_10px_rgba(239,68,68,0.5)]">WASTED!</h1>
            <div class="bg-black bg-opacity-50 rounded-xl p-5 mb-6 border border-red-500 border-opacity-30">
                <p class="text-gray-400 text-xs uppercase tracking-widest mb-1 font-bold">Total Score</p>
                <p class="font-black text-5xl text-gradient bg-gradient-to-br from-green-400 to-emerald-600 drop-shadow-md" id="final-score">0</p>
                <div class="mt-4 pt-4 border-t border-white border-opacity-10 flex justify-between text-sm font-bold">
                    <span class="text-cyan-400">GEMS: <span id="final-gems">0</span></span>
                    <span class="text-yellow-400">BEST: <span id="final-hi-score">0</span></span>
                </div>
            </div>
            <button id="restart-btn" class="btn-cinematic !from-red-600 !to-red-800 hover:!from-red-500 hover:!to-red-700 text-white px-8 py-4 rounded-xl font-black text-xl w-full pointer-events-auto uppercase tracking-widest shadow-lg">
                TRY AGAIN
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ==========================================
        // 0. HIGH SCORE SYSTEM
        // ==========================================
        let highScore = localStorage.getItem('dinoHighScore') || 0;
        document.getElementById('menu-hi-score').innerText = Math.floor(highScore);
        document.getElementById('hud-hi-score').innerText = Math.floor(highScore);

        // ==========================================
        // 1. PROCEDURAL AUDIO (FIXED BROWSER AUTOPLAY)
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.exponentialRampToValueAtTime(800, t + 0.3);
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.start(t); osc.stop(t + 0.3);
            } 
            else if (type === 'collect') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, t);
                osc.frequency.setValueAtTime(1800, t + 0.1);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.start(t); osc.stop(t + 0.3);
            }
            else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.exponentialRampToValueAtTime(10, t + 0.5);
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                osc.start(t); osc.stop(t + 0.5);
                
                const roar = audioCtx.createOscillator();
                const roarGain = audioCtx.createGain();
                roar.type = 'sawtooth';
                roar.frequency.setValueAtTime(90, t);
                roar.frequency.linearRampToValueAtTime(40, t + 0.8);
                roar.connect(roarGain); roarGain.connect(audioCtx.destination);
                roarGain.gain.setValueAtTime(0.6, t);
                roarGain.gain.linearRampToValueAtTime(0.01, t + 0.8);
                roar.start(t); roar.stop(t + 0.8);
            }
            else if (type === 'step') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.exponentialRampToValueAtTime(50, t + 0.1);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            }
        }

        // ==========================================
        // 2. SCENE, CAMERA & LIGHTING (BRIGHT DAYTIME)
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 30, 150); // Linear bright fog

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
        let baseCameraPos = new THREE.Vector3(0, 5, 12);
        camera.position.copy(baseCameraPos);
        camera.lookAt(0, 1.5, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5; // Brightness
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.4, 0.85));

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x4ade80, 0.8);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(30, 50, -20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 10; dirLight.shadow.camera.far = 150;
        const d = 40; dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d; dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Ground (Mossy Green)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(200, 500, 20, 20),
            new THREE.MeshStandardMaterial({ color: 0x3cb371, roughness: 1.0 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==========================================
        // 3. MODELS & PARTICLES
        // ==========================================
        let particles = [];
        const dustGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
        const dustMat = new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.6 });
        const burstMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true });

        function spawnDust(x, z) {
            if(Math.random() > 0.3 || isJumping) return;
            const p = new THREE.Mesh(dustGeo, dustMat);
            p.position.set(x + (Math.random()-0.5)*0.5, 0.2, z);
            p.userData = { life: 1.0, decay: 0.05, vx: (Math.random()-0.5)*0.1, vy: Math.random()*0.1, vz: gameSpeed };
            scene.add(p); particles.push(p);
        }

        function spawnGemBurst(pos) {
            for(let i=0; i<15; i++) {
                const p = new THREE.Mesh(new THREE.TetrahedronGeometry(0.2), burstMat);
                p.position.copy(pos);
                p.userData = { life: 1.0, decay: 0.08, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5, vz: (Math.random()-0.5)*0.5 + gameSpeed };
                scene.add(p); particles.push(p);
            }
        }

        // PLAYER: CAVEMAN
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const cavemanMat = new THREE.MeshStandardMaterial({color: 0xfcb085, roughness: 0.5}); // Skin
        const clothMat = new THREE.MeshStandardMaterial({color: 0x8b4513, roughness: 0.9}); // Cloth

        // Torso
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.7, 16), clothMat);
        torso.position.y = 1.2;
        torso.castShadow = true;
        playerGroup.add(torso);

        // Head
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), cavemanMat);
        head.position.y = 0.6;
        head.castShadow = true;
        torso.add(head);

        // Limbs function for pivots
        function createLimb(mat, w, h, d, yOffset) {
            const pivot = new THREE.Group();
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(w, w*0.8, h, 16), mat);
            mesh.position.y = yOffset;
            mesh.castShadow = true;
            pivot.add(mesh);
            return pivot;
        }

        const armL = createLimb(cavemanMat, 0.12, 0.6, 0.12, -0.3); armL.position.set(-0.45, 1.4, 0); playerGroup.add(armL);
        const armR = createLimb(cavemanMat, 0.12, 0.6, 0.12, -0.3); armR.position.set(0.45, 1.4, 0); playerGroup.add(armR);
        const legL = createLimb(cavemanMat, 0.15, 0.7, 0.15, -0.35); legL.position.set(-0.2, 0.8, 0); playerGroup.add(legL);
        const legR = createLimb(cavemanMat, 0.15, 0.7, 0.15, -0.35); legR.position.set(0.2, 0.8, 0); playerGroup.add(legR);

        // ENEMY: REALISTIC T-REX
        const tRexGroup = new THREE.Group();
        tRexGroup.position.set(0, 0, 15);
        scene.add(tRexGroup);

        const trexMat = new THREE.MeshStandardMaterial({ color: 0x3d8c7c, roughness: 0.6 }); // Teal/Green
        const trexBellyMat = new THREE.MeshStandardMaterial({ color: 0xf2e8c9, roughness: 0.7 }); // Cream belly

        // Body
        const bodyGeo = new THREE.SphereGeometry(1.6, 32, 32); bodyGeo.scale(1, 1, 1.8);
        const tBody = new THREE.Mesh(bodyGeo, trexMat);
        tBody.position.y = 4.0; tBody.castShadow = true; tRexGroup.add(tBody);

        const bellyGeo = new THREE.SphereGeometry(1.5, 32, 32); bellyGeo.scale(1, 0.9, 1.7);
        const tBelly = new THREE.Mesh(bellyGeo, trexBellyMat);
        tBelly.position.set(0, -0.2, 0.1); tBody.add(tBelly);

        // Tail
        const tailGeo = new THREE.ConeGeometry(0.8, 3.5, 32); tailGeo.rotateX(Math.PI/2);
        const tTail = new THREE.Mesh(tailGeo, trexMat);
        tTail.position.set(0, 4.2, 2.5); tTail.castShadow = true; tRexGroup.add(tTail);

        // Head Group
        const tHeadGroup = new THREE.Group();
        tHeadGroup.position.set(0, 4.8, -2.2);
        tRexGroup.add(tHeadGroup);

        const skullGeo = new THREE.SphereGeometry(1.0, 32, 32); skullGeo.scale(1, 0.8, 1.4);
        const tSkull = new THREE.Mesh(skullGeo, trexMat);
        tSkull.castShadow = true; tHeadGroup.add(tSkull);

        // Jaw and Teeth
        const jawGeo = new THREE.SphereGeometry(0.9, 32, 32); jawGeo.scale(1, 0.4, 1.3);
        const tJaw = new THREE.Mesh(jawGeo, trexBellyMat);
        tJaw.position.set(0, -0.6, 0.1);
        tJaw.rotation.x = 0.5; // Open mouth
        tJaw.castShadow = true; tHeadGroup.add(tJaw);

        const toothGeo = new THREE.ConeGeometry(0.08, 0.3, 8);
        const toothMat = new THREE.MeshStandardMaterial({color: 0xffffff});
        for(let i=0; i<6; i++) {
            const toothUpper = new THREE.Mesh(toothGeo, toothMat);
            toothUpper.position.set(-0.7 + i*0.28, -0.6, -0.8 + Math.abs(i-2.5)*0.1);
            tHeadGroup.add(toothUpper);
            const toothLower = new THREE.Mesh(toothGeo, toothMat);
            toothLower.position.set(-0.7 + i*0.28, -0.3, -0.8 + Math.abs(i-2.5)*0.1);
            toothLower.rotation.x = Math.PI;
            tJaw.add(toothLower);
        }

        // Eyes
        const eyeMat = new THREE.MeshBasicMaterial({color: 0xffaa00});
        const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.15), eyeMat); eyeR.position.set(0.9, 0.3, -0.5); tHeadGroup.add(eyeR);
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15), eyeMat); eyeL.position.set(-0.9, 0.3, -0.5); tHeadGroup.add(eyeL);

        // Legs (Muscular)
        const thighGeo = new THREE.SphereGeometry(1.0, 32, 32); thighGeo.scale(0.8, 1.5, 1.0);
        const tThighL = new THREE.Mesh(thighGeo, trexMat); tThighL.position.set(-1.6, 2.5, 0.5); tRexGroup.add(tThighL);
        const tThighR = new THREE.Mesh(thighGeo, trexMat); tThighR.position.set(1.6, 2.5, 0.5); tRexGroup.add(tThighR);

        const calfGeo = new THREE.CylinderGeometry(0.3, 0.2, 1.5, 16);
        const tLegL = new THREE.Mesh(calfGeo, trexMat); tLegL.position.set(-1.6, 0.8, -0.2); tRexGroup.add(tLegL);
        const tLegR = new THREE.Mesh(calfGeo, trexMat); tLegR.position.set(1.6, 0.8, -0.2); tRexGroup.add(tLegR);

        // Spikes
        for(let i=0; i<8; i++) {
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.6, 8), trexMat);
            spike.position.set(0, 5.5 - i*0.2, -1.0 + i*0.6);
            spike.rotation.x = -0.5;
            tRexGroup.add(spike);
        }

        // ==========================================
        // 4. GAME LOGIC & CONTROLS
        // ==========================================
        let isPlaying = false, isGameOver = false;
        let score = 0, gems = 0, gameSpeed = 0.6;
        let currentLane = 0; const laneWidth = 4.0;
        let yVel = 0, isJumping = false;
        const jumpForce = 0.9, gravity = -0.05;
        let obstacles = [], collectibles = [];
        let shakeIntensity = 0;
        let stepTimer = 0;

        function spawnObstacle() {
            if (!isPlaying) return;
            const lane = Math.floor(Math.random() * 3) - 1;
            const isTree = Math.random() > 0.5;
            const obs = new THREE.Group();
            
            if(isTree) {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 2, 16), new THREE.MeshStandardMaterial({color: 0x5c4033}));
                trunk.position.y = 1; trunk.castShadow = true; obs.add(trunk);
                for(let j=0; j<3; j++) {
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(2 - j*0.4, 2.5, 16), new THREE.MeshStandardMaterial({color: 0x14532d}));
                    leaves.position.y = 2.5 + j*1.2; leaves.castShadow = true; obs.add(leaves);
                }
                obs.userData = { hitR: 1.0, hitH: 5.0 };
            } else {
                const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5), new THREE.MeshStandardMaterial({color: 0x556b2f, roughness: 1}));
                rock.position.y = 0.8; rock.rotation.set(Math.random(), Math.random(), 0); rock.castShadow = true; obs.add(rock);
                obs.userData = { hitR: 1.4, hitH: 1.8 };
            }
            
            obs.position.set(lane * laneWidth, 0, -150);
            scene.add(obs); obstacles.push(obs);
            setTimeout(spawnObstacle, Math.max(300, 1000 - gameSpeed*400));
        }

        function spawnGem() {
            if(!isPlaying) return;
            const lane = Math.floor(Math.random()*3)-1;
            const gem = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.6), 
                new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.8})
            );
            gem.position.set(lane * laneWidth, 1.8, -150);
            scene.add(gem); collectibles.push(gem);
            setTimeout(spawnGem, 800 + Math.random()*1500);
        }

        function resetGame() {
            initAudio(); // Required for Safari/Chrome autoplay policy
            
            score = 0; gems = 0; gameSpeed = 0.6; currentLane = 0;
            playerGroup.position.set(0,0,0); tRexGroup.position.set(0,0,15);
            isJumping = false; yVel = 0; shakeIntensity = 0; playerGroup.rotation.x = 0;
            
            obstacles.forEach(o => scene.remove(o)); obstacles = [];
            collectibles.forEach(c => scene.remove(c)); collectibles = [];
            particles.forEach(p => scene.remove(p)); particles = [];
            
            document.getElementById('score-val').innerText = '0';
            document.getElementById('gems-val').innerText = '0';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('score-hud').style.display = 'block';
            
            isPlaying = true; isGameOver = false;
            camera.position.copy(baseCameraPos);
            spawnObstacle(); setTimeout(spawnGem, 1000);
        }

        function die() {
            isPlaying = false; isGameOver = true;
            playSound('crash');
            shakeIntensity = 0.8; 

            if(score > highScore) {
                highScore = score;
                localStorage.setItem('dinoHighScore', highScore);
                document.getElementById('hud-hi-score').innerText = Math.floor(highScore);
            }

            document.getElementById('final-score').innerText = Math.floor(score);
            document.getElementById('final-gems').innerText = gems;
            document.getElementById('final-hi-score').innerText = Math.floor(highScore);
            
            setTimeout(() => {
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('score-hud').style.display = 'none';
            }, 1000);
        }

        function moveLeft() { if(currentLane > -1 && isPlaying) currentLane--; }
        function moveRight() { if(currentLane < 1 && isPlaying) currentLane++; }
        function jump() { 
            if(!isJumping && isPlaying) { 
                isJumping = true; yVel = jumpForce; 
                playSound('jump');
            } 
        }

        window.addEventListener('keydown', e => {
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft();
            if(e.code === 'KeyD' || e.code === 'ArrowRight') moveRight();
            if(e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') jump();
        });

        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY;
        });
        window.addEventListener('touchend', e => {
            let dx = e.changedTouches[0].screenX - touchStartX;
            let dy = e.changedTouches[0].screenY - touchStartY;
            if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) { dx > 0 ? moveRight() : moveLeft(); } 
            else if(Math.abs(dy) > 30 && dy < 0) jump();
            else if(Math.abs(dx) < 10 && Math.abs(dy) < 10) jump();
        });

        document.getElementById('start-btn').onclick = resetGame;
        document.getElementById('restart-btn').onclick = resetGame;

        // ==========================================
        // 5. MAIN ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            const t = Date.now();

            if(shakeIntensity > 0.01) {
                camera.position.x = baseCameraPos.x + (Math.random()-0.5) * shakeIntensity;
                camera.position.y = baseCameraPos.y + (Math.random()-0.5) * shakeIntensity;
                camera.position.z = baseCameraPos.z + (Math.random()-0.5) * shakeIntensity;
                shakeIntensity *= 0.9;
            } else { camera.position.copy(baseCameraPos); }

            if(isPlaying) {
                score += gameSpeed * 0.3;
                document.getElementById('score-val').innerText = Math.floor(score);
                if(gameSpeed < 2.0) gameSpeed += 0.0003;

                // Snappy Lane Change
                playerGroup.position.x += (currentLane * laneWidth - playerGroup.position.x) * 0.2;

                // Caveman Animation
                const runCycle = t * 0.015 * gameSpeed;
                
                if(isJumping) {
                    playerGroup.position.y += yVel;
                    yVel += gravity;
                    // Front Flip Animation
                    playerGroup.rotation.x -= 0.15;
                    armL.rotation.x = Math.PI; armR.rotation.x = Math.PI; // Arms up
                    legL.rotation.x = -0.5; legR.rotation.x = -0.5; // Legs tucked
                    
                    if(playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0; isJumping = false; yVel = 0;
                        playerGroup.rotation.x = 0; // Reset flip
                        shakeIntensity = 0.1;
                    }
                } else {
                    playerGroup.rotation.x = 0;
                    // Running Arms & Legs (Math.sin)
                    armL.rotation.x = Math.sin(runCycle) * 1.5;
                    armR.rotation.x = Math.sin(runCycle + Math.PI) * 1.5;
                    legL.rotation.x = Math.sin(runCycle + Math.PI) * 1.2;
                    legR.rotation.x = Math.sin(runCycle) * 1.2;
                    
                    playerGroup.position.y = Math.abs(Math.sin(runCycle * 2)) * 0.2; // Body bobbing
                    spawnDust(playerGroup.position.x, playerGroup.position.z + 0.5);

                    // Footstep audio
                    stepTimer += gameSpeed;
                    if(stepTimer > 8) { playSound('step'); stepTimer = 0; }
                }

                // T-Rex Animation
                tRexGroup.position.x += (playerGroup.position.x - tRexGroup.position.x) * 0.04;
                const trexRun = t * 0.012 * gameSpeed;
                tLegL.rotation.x = Math.sin(trexRun) * 0.6;
                tThighL.rotation.x = Math.sin(trexRun) * 0.4;
                tLegR.rotation.x = Math.sin(trexRun + Math.PI) * 0.6;
                tThighR.rotation.x = Math.sin(trexRun + Math.PI) * 0.4;
                tRexGroup.position.y = Math.abs(Math.sin(trexRun * 2)) * 0.3; // Bounce
                tHeadGroup.rotation.x = Math.sin(trexRun) * 0.1; // Head bob

                // Objects Update
                for(let i=obstacles.length-1; i>=0; i--) {
                    let o = obstacles[i]; o.position.z += gameSpeed;
                    if(Math.abs(playerGroup.position.z - o.position.z) < 1.5 && 
                       Math.abs(playerGroup.position.x - o.position.x) < o.userData.hitR &&
                       playerGroup.position.y < o.userData.hitH) {
                        die();
                    }
                    if(o.position.z > 25) { scene.remove(o); obstacles.splice(i,1); }
                }

                for(let i=collectibles.length-1; i>=0; i--) {
                    let c = collectibles[i]; c.position.z += gameSpeed;
                    c.rotation.y += 0.05; c.rotation.x += 0.05;
                    c.position.y = 1.8 + Math.sin(t*0.005)*0.3;
                    
                    if(Math.abs(playerGroup.position.z - c.position.z) < 2.0 && 
                       Math.abs(playerGroup.position.x - c.position.x) < 2.0 &&
                       Math.abs(playerGroup.position.y + 1.0 - c.position.y) < 2.5) {
                        playSound('collect'); spawnGemBurst(c.position);
                        scene.remove(c); collectibles.splice(i,1);
                        score += 50; gems++; document.getElementById('gems-val').innerText = gems;
                    } else if(c.position.z > 25) { scene.remove(c); collectibles.splice(i,1); }
                }
            } else if (isGameOver) {
                if(tRexGroup.position.z > playerGroup.position.z + 1.5) {
                    tRexGroup.position.z -= 0.6;
                    tRexGroup.position.x += (playerGroup.position.x - tRexGroup.position.x) * 0.1;
                }
            }

            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.position.add(new THREE.Vector3(p.userData.vx, p.userData.vy, p.userData.vz));
                p.userData.life -= p.userData.decay;
                p.scale.setScalar(Math.max(0, p.userData.life));
                p.material.opacity = p.userData.life;
                if(p.userData.life <= 0) { scene.remove(p); particles.splice(i,1); }
            }

            composer.render();
        }
        animate();
    </script>
</body>
</html>
