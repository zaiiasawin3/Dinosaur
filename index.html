<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino 3D Pro Daytime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Map for Modern Three.js & Post-Processing -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Bright sky blue fallback */
            font-family: 'Inter', sans-serif;
            touch-action: none;
            user-select: none;
        }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        
        /* Pro UI - clean and high contrast */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        .glass-panel {
            pointer-events: auto;
            background: rgba(10, 20, 30, 0.75);
            padding: 3rem; border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff; max-width: 90%; width: 480px; text-align: center;
        }
        #score-hud {
            position: absolute; top: 30px; right: 30px;
            background: rgba(0, 0, 0, 0.6); color: #fff;
            padding: 12px 24px; border-radius: 12px;
            font-size: 1.8rem; font-weight: 900; letter-spacing: 1px;
            backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); display: none;
            text-shadow: 1px 1px 2px #000;
        }
        #score-hud span#score-val { color: #4ade80; }
        .btn-cinematic {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transition: all 0.2s ease-out;
            border: 1px solid rgba(255,255,255,0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn-cinematic:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transform: translateY(-2px); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5);
        }
        .btn-cinematic:active { transform: translateY(1px); }
        
        .text-gradient {
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="score-hud">
        <div class="flex justify-between items-center gap-6">
            <span>SCORE</span> <span id="score-val">0</span>
        </div>
        <div class="text-sm text-cyan-400 mt-1 flex justify-between items-center gap-6">
            <span>GEMS</span> <span id="gems-val" class="font-bold">0</span>
        </div>
    </div>

    <div class="ui-layer" id="ui-container">
        <!-- Start Menu -->
        <div id="start-screen" class="glass-panel">
            <h1 class="text-5xl font-black mb-2 tracking-wider text-gradient bg-gradient-to-r from-blue-400 to-emerald-400">PRIMAL PRO</h1>
            <p class="text-gray-300 mb-8 text-lg font-medium">Daytime Forest Escape</p>
            <div class="text-sm text-gray-200 mb-8 space-y-4 bg-black bg-opacity-50 p-6 rounded-xl text-left border border-white border-opacity-10">
                <div class="flex items-center"><span class="text-2xl mr-4">⌨️</span> <div><b>PC:</b> A/D or Arrows to Dodge.<br>Space/W to Jump.</div></div>
                <div class="flex items-center"><span class="text-2xl mr-4">📱</span> <div><b>Mobile:</b> Swipe Left/Right.<br>Tap to Jump.</div></div>
            </div>
            <button id="start-btn" class="btn-cinematic text-white px-8 py-4 rounded-xl font-black text-xl w-full pointer-events-auto uppercase tracking-widest shadow-lg">
                Start Game
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="glass-panel hidden" style="border-color: rgba(239,68,68,0.5);">
            <h1 class="text-6xl font-black text-red-500 mb-2 tracking-widest drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">BUSTED!</h1>
            <p class="text-gray-300 mb-8 text-lg font-medium">The T-Rex got you.</p>
            <div class="bg-black bg-opacity-60 rounded-xl p-6 mb-8 border border-red-500 border-opacity-40">
                <p class="text-gray-400 text-sm uppercase tracking-widest mb-1 font-bold">Total Score</p>
                <p class="font-black text-6xl text-gradient bg-gradient-to-br from-green-400 to-emerald-600 drop-shadow-md" id="final-score">0</p>
                <p class="text-cyan-400 mt-4 text-xl font-bold uppercase tracking-wider flex justify-between px-4">
                    <span>Gems:</span> <span id="final-gems">0</span>
                </p>
            </div>
            <button id="restart-btn" class="btn-cinematic !from-red-600 !to-red-800 hover:!from-red-500 hover:!to-red-700 text-white px-8 py-4 rounded-xl font-black text-xl w-full pointer-events-auto uppercase tracking-widest shadow-lg">
                Try Again
            </button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ==========================================
        // 1. SCENE, CAMERA, RENDERER (BRIGHT DAYTIME)
        // ==========================================
        const scene = new THREE.Scene();
        const skyColor = new THREE.Color(0x87CEEB); // Bright sky blue
        scene.background = skyColor;
        // Fog is much lighter and further away for pro-gamer visibility
        scene.fog = new THREE.FogExp2(0x9bd4e8, 0.012); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);
        camera.position.set(0, 4.5, 9); 
        camera.lookAt(0, 1.5, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3; // Brighter exposure
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ==========================================
        // 2. POST-PROCESSING (BLOOM)
        // ==========================================
        const renderScene = new RenderPass(scene, camera);
        // Reduced bloom strength for daytime, keeping gems glowing
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.4, 0.6);
        
        const outputPass = new OutputPass();
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);
        composer.addPass(outputPass);

        // ==========================================
        // 3. LIGHTING (DAYTIME HIGH CONTRAST)
        // ==========================================
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445533, 0.8);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffee, 3.0); // Strong sun
        dirLight.position.set(30, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; // High res shadows for clarity
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        const d = 40;
        dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // ==========================================
        // 4. ENVIRONMENT (VIVID FOREST)
        // ==========================================
        // Lighter green ground for better obstacle contrast
        const groundMat = new THREE.MeshStandardMaterial({ 
            color: 0x4a7c36, roughness: 0.9, metalness: 0.0 
        });
        const groundGeo = new THREE.PlaneGeometry(150, 400, 20, 20);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==========================================
        // 5. PROCEDURAL MODELS
        // ==========================================
        
        // --- Player (SUV + Caveman) ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        const suvBodyGroup = new THREE.Group();
        const suvWheels = []; 

        // SUV Materials (Sleek Blue)
        const carPaintMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, metalness: 0.4, roughness: 0.4 }); 
        const carGlassMat = new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.8, roughness: 0.2 });
        const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.3, metalness: 0.8 });

        // SUV Lower Body (Smooth styling)
        const lowerBodyGeo = new THREE.CylinderGeometry(1.2, 1.2, 3.8, 16);
        lowerBodyGeo.rotateZ(Math.PI/2);
        lowerBodyGeo.scale(1.0, 0.5, 1.0);
        const lowerBody = new THREE.Mesh(lowerBodyGeo, carPaintMat);
        lowerBody.position.y = 0.9;
        lowerBody.castShadow = true;
        suvBodyGroup.add(lowerBody);
        
        const bumper = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.6, 4.0), carPaintMat);
        bumper.position.y = 0.8; bumper.castShadow = true;
        suvBodyGroup.add(bumper);

        // SUV Cabin
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 2.0), carGlassMat);
        cabin.position.set(0, 1.45, -0.2);
        cabin.castShadow = true;
        suvBodyGroup.add(cabin);

        // Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 32); wheelGeo.rotateZ(Math.PI / 2);
        const rimGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.42, 16); rimGeo.rotateZ(Math.PI / 2);

        const wheelPositions = [ [-1.05, 0.45, 1.2], [1.05, 0.45, 1.2], [-1.05, 0.45, -1.2], [1.05, 0.45, -1.2] ];
        wheelPositions.forEach(pos => {
            const wGroup = new THREE.Group();
            const tire = new THREE.Mesh(wheelGeo, tireMat); 
            const rim = new THREE.Mesh(rimGeo, rimMat);
            tire.castShadow = true; 
            wGroup.add(tire, rim); 
            wGroup.position.set(...pos);
            suvBodyGroup.add(wGroup); 
            suvWheels.push(wGroup);
        });
        playerGroup.add(suvBodyGroup);

        // Caveman sitting on roof
        const caveman = new THREE.Group();
        caveman.position.set(0, 1.8, -0.2);
        
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xde9b71, roughness: 0.6 });
        const clothMat = new THREE.MeshStandardMaterial({ color: 0x4a2e1b, roughness: 0.9 });
        
        const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), skinMat); pHead.position.y = 0.9; pHead.castShadow = true;
        const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.6, 16), clothMat); pBody.position.y = 0.4; pBody.castShadow = true;
        const pArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.4, 16), skinMat); pArmL.position.set(-0.3, 0.5, 0.2); pArmL.rotation.x = -Math.PI / 4; pArmL.castShadow = true;
        const pArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.4, 16), skinMat); pArmR.position.set(0.3, 0.5, 0.2); pArmR.rotation.x = -Math.PI / 4; pArmR.castShadow = true;
        
        caveman.add(pHead, pBody, pArmL, pArmR);
        playerGroup.add(caveman);

        // --- Enemy (T-Rex: Watercolor green, cream belly, spikes) ---
        const tRexGroup = new THREE.Group();
        tRexGroup.position.set(0, 0, 18); 
        scene.add(tRexGroup);

        const tGreenMat = new THREE.MeshStandardMaterial({ color: 0x528c68, roughness: 0.8, metalness: 0.1 }); // Watercolor green
        const tBellyMat = new THREE.MeshStandardMaterial({ color: 0xe6dcb8, roughness: 0.9 }); // Cream belly
        const tToothMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        const tEyeMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff3300, emissiveIntensity: 3.0 }); 

        // Main Body & Belly
        const tBody = new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 32), tGreenMat); 
        tBody.scale.set(0.9, 1.2, 1.8); tBody.position.y = 3.2; tBody.rotation.x = 0.2; tBody.castShadow = true;
        
        const tBelly = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), tBellyMat); 
        tBelly.scale.set(0.85, 1.15, 1.7); tBelly.position.set(0, -0.1, 0.2); 
        tBody.add(tBelly);
        tRexGroup.add(tBody);

        // Head Group (Open Jaw)
        const tHeadGroup = new THREE.Group(); 
        tHeadGroup.position.set(0, 4.2, -2.5); 
        tRexGroup.add(tHeadGroup);
        
        const tSkull = new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 32), tGreenMat); 
        tSkull.scale.set(1, 0.8, 1.6); tSkull.castShadow = true; 
        tHeadGroup.add(tSkull);
        
        const tJaw = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 32), tBellyMat); 
        tJaw.scale.set(0.9, 0.4, 1.5); tJaw.position.set(0, -0.7, 0.2); 
        tJaw.rotation.x = 0.6; // Keep jaw open wide
        tJaw.castShadow = true; 
        tHeadGroup.add(tJaw);

        // Teeth & Eyes
        const toothGeo = new THREE.ConeGeometry(0.08, 0.35, 8);
        for(let i=0; i<6; i++) {
            let tl = new THREE.Mesh(toothGeo, tToothMat); tl.position.set(-0.7, -0.6, -1.2 + i*0.4); tl.rotation.x = Math.PI; tSkull.add(tl);
            let tr = new THREE.Mesh(toothGeo, tToothMat); tr.position.set(0.7, -0.6, -1.2 + i*0.4); tr.rotation.x = Math.PI; tSkull.add(tr);
            let jl = new THREE.Mesh(toothGeo, tToothMat); jl.position.set(-0.6, 0.3, -1.0 + i*0.4); tJaw.add(jl);
            let jr = new THREE.Mesh(toothGeo, tToothMat); jr.position.set(0.6, 0.3, -1.0 + i*0.4); tJaw.add(jr);
        }
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), tEyeMat); eyeL.position.set(-0.75, 0.3, -0.8); tHeadGroup.add(eyeL);
        const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), tEyeMat); eyeR.position.set(0.75, 0.3, -0.8); tHeadGroup.add(eyeR);

        // Tail & Spikes
        const tTail = new THREE.Mesh(new THREE.ConeGeometry(1.0, 5.5, 32), tGreenMat); 
        tTail.position.set(0, 2.5, 4.2); tTail.rotation.x = -1.2; tTail.castShadow = true; 
        tRexGroup.add(tTail);
        
        const spikeGeo = new THREE.ConeGeometry(0.2, 0.8, 8);
        for(let i=0; i<6; i++) { let s = new THREE.Mesh(spikeGeo, tGreenMat); s.position.set(0, 1.4, -1.5 + i*0.7); tBody.add(s); }
        for(let i=0; i<4; i++) { let s = new THREE.Mesh(spikeGeo, tGreenMat); s.position.set(0, 1.2, i*1.2 - 1.0); s.rotation.x = 1.5; tTail.add(s); }

        // Legs
        const dLegGeo = new THREE.CylinderGeometry(0.5, 0.3, 2.5, 16);
        const tLegL = new THREE.Mesh(dLegGeo, tGreenMat); tLegL.position.set(-1.2, 1.25, 1.5); tLegL.castShadow = true; tRexGroup.add(tLegL);
        const tLegR = new THREE.Mesh(dLegGeo, tGreenMat); tLegR.position.set(1.2, 1.25, 1.5); tLegR.castShadow = true; tRexGroup.add(tLegR);

        // ==========================================
        // 6. GAME STATE & OBSTACLES (PRO TUNING)
        // ==========================================
        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let gems = 0;
        let gameSpeed = 0.5;
        const laneWidth = 3.5;
        let currentLane = 0; // -1, 0, 1
        
        // Snappy physics for responsive jumps
        let yVelocity = 0;
        const gravity = -0.045; 
        const jumpStrength = 0.75;
        let isJumping = false;
        let obstacles = [];
        let collectibles = [];

        // Obstacle Materials
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 1.0 }); // High contrast grey
        const barkMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 1.0 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.9 });
        const gemMat = new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x06b6d4, emissiveIntensity: 1.5, roughness: 0.1, metalness: 0.8 });
        const gemGeo = new THREE.OctahedronGeometry(0.4, 0);

        function spawnObstacle() {
            if (!isPlaying) return;
            const lane = Math.floor(Math.random() * 3) - 1;
            const xPos = lane * laneWidth;
            const isTree = Math.random() > 0.5;
            const obsGroup = new THREE.Group();
            let hitRadius, hitHeight;

            if (isTree) {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 2, 8), barkMat);
                trunk.position.y = 1; trunk.castShadow = true; obsGroup.add(trunk);
                
                const l1 = new THREE.Mesh(new THREE.ConeGeometry(1.6, 3.0, 16), leafMat); l1.position.y = 2.0; l1.castShadow = true; obsGroup.add(l1);
                const l2 = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.5, 16), leafMat); l2.position.y = 3.5; l2.castShadow = true; obsGroup.add(l2);
                
                // Fair hitbox: slightly smaller than visual
                hitRadius = 0.7; hitHeight = 4.0; 
            } else {
                const size = 1.0 + Math.random() * 0.5;
                const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 1), rockMat);
                rock.scale.set(1.5, 0.8, 1.2); rock.position.y = size * 0.7; 
                rock.rotation.set(Math.random(), Math.random(), 0); rock.castShadow = true;
                obsGroup.add(rock);
                
                // Fair hitbox
                hitRadius = size * 1.1; hitHeight = size * 1.3;
            }

            obsGroup.position.set(xPos, 0, -120); // Spawn further back
            scene.add(obsGroup);
            obstacles.push({ mesh: obsGroup, hitRadius, hitHeight });

            const nextSpawnTime = Math.max(300, 900 - (gameSpeed * 800) + (Math.random() * 400)); 
            setTimeout(spawnObstacle, nextSpawnTime);
        }

        function spawnItem() {
            if (!isPlaying) return;
            const lane = Math.floor(Math.random() * 3) - 1;
            const xPos = lane * laneWidth;
            
            const gem = new THREE.Mesh(gemGeo, gemMat);
            gem.position.set(xPos, 1.2, -120);
            gem.castShadow = true;
            
            scene.add(gem);
            collectibles.push(gem);
            
            const nextItemTime = Math.max(500, 1500 - (gameSpeed * 800) + (Math.random() * 800));
            setTimeout(spawnItem, nextItemTime);
        }

        // ==========================================
        // 7. LOGIC & CONTROLS
        // ==========================================
        const uiContainer = document.getElementById('ui-container');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const scoreHud = document.getElementById('score-hud');
        const scoreVal = document.getElementById('score-val');
        const gemsVal = document.getElementById('gems-val');

        function resetGame() {
            score = 0; gems = 0; gameSpeed = 0.6; currentLane = 0;
            playerGroup.position.set(0, 0, 0); playerGroup.rotation.set(0,0,0);
            tRexGroup.position.set(0, 0, 18); tRexGroup.rotation.set(0,0,0);
            isJumping = false; yVelocity = 0;
            
            obstacles.forEach(obs => scene.remove(obs.mesh)); obstacles = [];
            collectibles.forEach(gem => scene.remove(gem)); collectibles = [];
            
            scoreVal.innerText = score; gemsVal.innerText = gems;
            startScreen.classList.add('hidden'); gameOverScreen.classList.add('hidden');
            scoreHud.style.display = 'block'; uiContainer.style.pointerEvents = 'none'; 
            
            isPlaying = true; isGameOver = false;
            camera.position.set(0, 4.5, 9);
            spawnObstacle(); setTimeout(spawnItem, 1000);
        }

        function triggerGameOver() {
            isPlaying = false; isGameOver = true;
            let shakeTicks = 0;
            let shakeInterval = setInterval(() => {
                camera.position.x = (Math.random() - 0.5) * 1.5;
                camera.position.y = 4.5 + (Math.random() - 0.5) * 1.5;
                shakeTicks++;
                if(shakeTicks > 20) {
                    clearInterval(shakeInterval);
                    camera.position.set(0, 4.5, 9);
                    document.getElementById('final-score').innerText = Math.floor(score);
                    document.getElementById('final-gems').innerText = gems;
                    gameOverScreen.classList.remove('hidden');
                    scoreHud.style.display = 'none'; uiContainer.style.pointerEvents = 'auto'; 
                }
            }, 30);
        }

        function move(dir) {
            if(!isPlaying) return;
            currentLane += dir;
            if(currentLane < -1) currentLane = -1;
            if(currentLane > 1) currentLane = 1;
        }
        function jump() {
            if(!isPlaying || isJumping) return;
            isJumping = true; yVelocity = jumpStrength;
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(-1);
            if (e.code === 'ArrowRight' || e.code === 'KeyD') move(1);
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
        });

        // Touch
        let tX = 0, tY = 0;
        window.addEventListener('touchstart', (e) => { 
            tX = e.touches[0].screenX; tY = e.touches[0].screenY; 
        }, {passive: false});
        window.addEventListener('touchend', (e) => {
            let dx = e.changedTouches[0].screenX - tX;
            let dy = e.changedTouches[0].screenY - tY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
                move(dx > 0 ? 1 : -1); 
            } else if (dy < -30 || (Math.abs(dx) < 10 && Math.abs(dy) < 10)) {
                jump(); 
            }
        });

        document.getElementById('start-btn').addEventListener('click', resetGame);
        document.getElementById('restart-btn').addEventListener('click', resetGame);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 8. ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now();

            if (isPlaying) {
                // Score & Difficulty Curve
                score += gameSpeed * 0.2;
                scoreVal.innerText = Math.floor(score);
                if (gameSpeed < 1.5) gameSpeed += 0.00015; // Speed caps higher for pro gamers

                // Snappy Player Movement (Lerp 0.3 for fast lane change)
                playerGroup.position.x += (currentLane * laneWidth - playerGroup.position.x) * 0.3;

                // Jump Physics
                if (isJumping) {
                    playerGroup.position.y += yVelocity; 
                    yVelocity += gravity;
                    suvBodyGroup.rotation.x = -0.15; // Slight tilt
                    
                    if (playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0; 
                        isJumping = false; 
                        yVelocity = 0; 
                        suvBodyGroup.rotation.x = 0;
                    }
                }

                // SUV Wheels & Suspension
                if (!isJumping) {
                    const wheelRot = gameSpeed * 1.5;
                    suvWheels.forEach(w => w.rotation.x -= wheelRot); 
                    suvBodyGroup.position.y = Math.sin(time * 0.04) * 0.04; 
                    caveman.position.y = 1.8 + Math.sin(time * 0.04 + 1) * 0.03; 
                }

                // Enemy Follow Logic
                dinoFollowLogic(time);

                // Obstacles Logic
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.mesh.position.z += gameSpeed;
                    
                    let dz = Math.abs(playerGroup.position.z - obs.mesh.position.z);
                    let dx = Math.abs(playerGroup.position.x - obs.mesh.position.x);
                    
                    // Precise Hitbox detection
                    if (dz < 2.0 && dx < obs.hitRadius + 0.6) {
                        if (playerGroup.position.y < obs.hitHeight - 0.2) {
                            triggerGameOver();
                        }
                    }
                    if (obs.mesh.position.z > 15) { 
                        scene.remove(obs.mesh); 
                        obstacles.splice(i, 1); 
                    }
                }

                // Gems Logic
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    let gem = collectibles[i];
                    gem.position.z += gameSpeed;
                    
                    gem.rotation.y += 0.05;
                    gem.rotation.x += 0.02;
                    gem.position.y = 1.2 + Math.sin(time * 0.005 + i) * 0.3;
                    
                    let dz = Math.abs(playerGroup.position.z - gem.position.z);
                    let dx = Math.abs(playerGroup.position.x - gem.position.x);
                    let dy = Math.abs((playerGroup.position.y + 1.0) - gem.position.y);
                    
                    if (dz < 1.8 && dx < 1.8 && dy < 2.5) {
                        scene.remove(gem);
                        collectibles.splice(i, 1);
                        score += 50; 
                        gems++;
                        gemsVal.innerText = gems;
                    } else if (gem.position.z > 15) {
                        scene.remove(gem);
                        collectibles.splice(i, 1);
                    }
                }

            } else if (isGameOver) {
                // Death Animation
                if (tRexGroup.position.z > playerGroup.position.z + 1.5) {
                    tRexGroup.position.z -= 0.8;
                    tRexGroup.position.y -= 0.05;
                    tRexGroup.rotation.x -= 0.01;
                }
            } else {
                // Menu Idle
                camera.position.x = Math.sin(time * 0.0003) * 1.5;
                camera.lookAt(0, 1.5, -10);
                dinoFollowLogic(time);
            }

            composer.render();
        }

        // T-Rex Animation
        function dinoFollowLogic(time) {
            tRexGroup.position.x += (playerGroup.position.x - tRexGroup.position.x) * 0.05;
            const runCycle = Math.sin(time * 0.015);
            tRexGroup.position.y = runCycle * 0.4;
            tRexGroup.rotation.z = Math.sin(time * 0.01) * 0.02;
            
            tLegL.position.y = 1.25 + Math.max(0, runCycle * 0.5);
            tLegR.position.y = 1.25 + Math.max(0, -runCycle * 0.5);
        }

        // Init
        window.onload = () => animate();

    </script>
</body>
</html>
